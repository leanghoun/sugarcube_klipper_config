#####################################################################
#	Macros
#####################################################################
    
[gcode_macro PREHEAT_PRINT]
description: Start bed heat soak before printing
gcode:
    {% set BED = params.BED|default(110)|int %}

    M117 Preheating bed...
    M140 S{BED}
    SET_FAN_SPEED FAN=bed_fans SPEED=0.7

[gcode_macro PRINT_START]
description: Home, level, mesh, heat nozzle, and purge
gcode:
    {% set BED = params.BED|default(110)|int %}
    {% set HOTEND = params.HOTEND|default(255)|int %}

    SKEW_PROFILE LOAD=Califlower

    SET_FAN_SPEED FAN=bed_fans SPEED=0.7

    M117 Heating bed...
    M190 S{BED}

    # Bring nozzle to warm standby temperature for probing
    M117 Preheating nozzle...
    M104 S180

    # Home
    M117 Homing...
    G28

    # Level gantry
    M117 Leveling...
    Z_TILT_ADJUST

    # Z position may have changed after tilt
    M117 Homing Z...
    G28 Z

    # Fresh mesh
    M117 Meshing...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    # Move near purge location before final nozzle heat
    G90
    G0 X5 Y5 F6000

    # Final nozzle temperature
    M117 Heating nozzle...
    M109 S{HOTEND}

    PURGE

    M117

[gcode_macro PURGE]
description: Bed-front purge line
gcode:
    SAVE_GCODE_STATE NAME=purge_state

    M117 Purging...

    G90
    G0 Z0.4 F3000

    G91
    M83
    G1 X100 E18 F1200
    G1 Z6 F3000

    RESTORE_GCODE_STATE NAME=purge_state

[gcode_macro PRINT_END]
gcode:
    M117 Print complete

    #  Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #  Check end position to determine safe directions to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    SET_SKEW CLEAR=1

    #  Commence PRINT_END
    M400                              ; wait for buffer to clear
    G92 E0                            ; zero the extruder
    G91                               ; relative positioning
    G0 Z{z_safe} F3600                ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000     ; move nozzle to remove stringing
    M104 S0                           ; turn off hotend
    M140 S0                           ; turn off bed
    SET_FAN_SPEED FAN=bed_fans SPEED=0 ; turn off bed fans
    M106 S0                           ; turn off fan
    G90                               ; absolute positioning
    G0 X{max_x / 2} Y166 F3600        ; park nozzle at rear
    FORM_TIP

[gcode_macro FORM_TIP]
description: Helper: Round the filament tip
gcode:
    SAVE_GCODE_STATE NAME=form_tip_state

    M83
    G92 E0
    G1 E2 F100
    G1 E-2 F100
    G1 E4 F100
    G1 E-11 F100

    RESTORE_GCODE_STATE NAME=form_tip_state

[gcode_macro CENTER]
gcode:
    G90                        ; absolute positioning
    G0 Z15 F3600               ; move bed down
    G0 X85 Y87 F6000           ; X max 169, Y max 173


[gcode_macro FRONT]
gcode:
    G90                        ; absolute positioning
    G0 Z15 F3600               ; move bed down
    G0 X85 Y0 F6000


[gcode_macro REAR]
gcode:
    G90                        ; absolute positioning
    G0 Z15 F3600               ; move bed down
    G0 X85 Y166 F6000


[gcode_macro BELT]
description: A macro that assists with repeatable belt tensioning.
variable_y_tensioning_position: 119       #Position the printhead needs to be to have 150mm of belt length exposed for belt tensioning.
gcode:
    {% set x_max = printer.configfile.settings.stepper_x.position_max %}
    {% set travel_speed = printer.configfile.settings.printer.max_velocity %}

    G90                        ; absolute positioning
    G0 X85 Y{y_tensioning_position} F6000

[gcode_macro MOTORS_OFF]
gcode:
    M18

[gcode_macro COOLDOWN]
gcode:
    TURN_OFF_HEATERS 
    SET_FAN_SPEED FAN=bed_fans SPEED=0 ; turn off bed fans

